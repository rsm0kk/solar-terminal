  - id: sket
    name: SK이터닉스
    stock_code: "475150"
    corp_code: null
    market: KOSPI
    model: 태양광 개발·PPA·전력판매
    thesis: 국내 설치·PPA 수요·데이터센터 전력수요 → 개발 파이프라인 → 전력판매
    key_multiples: [개발용역 영업이익 멀티플, 발전자산 NAV, SOTP]
    primary_drivers:
      - smp_rec_revenue
