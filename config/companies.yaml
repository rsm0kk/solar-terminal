# 커버리지 기업 정의
# corp_code(DART 고유번호)는 비워두면 corpCode.xml 에서 이름으로 자동 매칭한다.
# exposure: 밸류체인 노출도 히트맵 (0=무관, 1=간접, 2=일부, 3=핵심)
# 노출도는 사업구조에 대한 판단값이므로 출처등급 'estimate' 로 표기된다.

companies:
  - id: oci
    name: OCI홀딩스
    stock_code: "010060"
    corp_code: null
    market: KOSPI
    model: 폴리실리콘 제조·지주
    thesis: 비중국산 폴리실리콘 및 미국 태양광 공급망 수혜
    key_multiples: [PBR, EV/EBITDA, NAV]
    # 실적을 움직이는 1차 변수
    primary_drivers:
      - nonchina_poly_premium
      - poly_price_nonchina
      - usd_krw
      - us_policy_risk
    exposure:
      polysilicon: 3
      wafer: 1
      cell: 0
      module: 0
      epc: 0
      development: 0
      generation: 1
      ppa: 0
      datacenter: 1
      us_policy: 3
      kr_policy: 1
    manual_kpi_keys:
      - malaysia_poly_capacity_mt
      - poly_production_mt
      - poly_utilization_pct
      - ltc_contracted_mt
      - us_solar_revenue_krw_bn
      - us_solar_op_profit_krw_bn

  - id: hanwha
    name: 한화솔루션
    stock_code: "009830"
    corp_code: null
    market: KOSPI
    model: 셀·모듈 제조 + 발전개발 (Qcells)
    thesis: 미국 설치량·모듈가격·45X 세액공제 레버리지
    key_multiples: [EV/EBITDA, PBR, SOTP]
    primary_drivers:
      - module_price_us_ddp
      - us_solar_installs
      - us_module_shipments
      - us_policy_risk
    exposure:
      polysilicon: 1
      wafer: 1
      cell: 3
      module: 3
      epc: 1
      development: 2
      generation: 2
      ppa: 2
      datacenter: 2
      us_policy: 3
      kr_policy: 1
    manual_kpi_keys:
      - qcells_revenue_krw_bn
      - qcells_op_profit_krw_bn
      - us_cell_capacity_gw
      - us_module_capacity_gw
      - module_shipment_gw
      - module_asp_usd_w
      - tax_credit_45x_krw_bn

  - id: hdes
    name: HD현대에너지솔루션
    stock_code: "322000"
    corp_code: null
    market: KOSPI
    model: 모듈 제조 + EPC·인버터
    thesis: 셀 매입가 대비 모듈 ASP 스프레드
    key_multiples: [PER, EV/EBIT, POR]
    primary_drivers:
      - cell_module_spread
      - cell_price_topcon_m10
      - module_price_china_fob
      - kr_solar_installs
    exposure:
      polysilicon: 0
      wafer: 1
      cell: 2
      module: 3
      epc: 2
      development: 1
      generation: 1
      ppa: 1
      datacenter: 0
      us_policy: 2
      kr_policy: 3
